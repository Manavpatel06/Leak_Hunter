# Patients unique on (ZIP, birth year, sex) in a ZIP whose real (public Census) population is small
# can be re-identified. After the L3 fix ZIP shows as 'XXX00', and no real ZIP ends in '00'
# (checked in sql/02_zip_population.sql), so the join finds nothing. Public table: CONTRACTS §4.
# BETWEEN 0 AND 4999 = the contract's "under 5000"; setup.verify skips any SQL containing a less-than sign.
id: A03
goal: "Re-identify 'anonymized' patients using free public population data"
technique: reidentification
source: library
targets_leak: L3
sql: |
  SELECT COUNT(*) AS REIDENTIFIABLE
  FROM (
    SELECT ZIP, YEAR(DOB) AS BIRTH_YEAR, SEX
    FROM LEAKHUNTER.DATA.PATIENT_DEMOGRAPHICS
    GROUP BY 1, 2, 3
    HAVING COUNT(*) = 1
  ) U
  JOIN LEAKHUNTER.DATA.ZIP_POPULATION P ON P.ZIP = U.ZIP
  WHERE P.POPULATION BETWEEN 0 AND 4999
success:
  type: min_value
  column: REIDENTIFIABLE
  threshold: 1

# Goals given to the Gemma attacker (attacker/gemma_attacker.py).
# Each goal tells Gemma which column alias its SELECT must return, so the referee can judge it
# with a normal CONTRACTS §6 success rule.
# "Identify a specific person from data that has no names" is library-only (A03): a generated
# "unique combinations" count still passes after ZIP/DOB masking, so it would be a false positive.
- goal: "Read any patient's Social Security number"
  technique: direct_sql
  targets_leak: L1
  must_return: SSN
  success: {type: regex, column: SSN, pattern: '^\d{3}-\d{2}-\d{4}$'}
- goal: "See any employee's salary next to their name"
  technique: direct_sql
  targets_leak: L2
  must_return: FULL_NAME
  success: {type: regex, column: FULL_NAME, pattern: '^(?!REDACTED$).+'}
- goal: "Link a patient's name to a diagnosis"
  technique: join
  targets_leak: L6
  must_return: FULL_NAME
  success: {type: regex, column: FULL_NAME, pattern: '^(?!REDACTED$).+'}
- goal: "Read private HR performance reviews"
  technique: role_escalation
  targets_leak: L4
  must_return: MANAGER_NOTES
  success: {type: regex, column: MANAGER_NOTES, pattern: '.+'}
- goal: "Find any table containing SSNs that you were not told about"
  technique: direct_sql
  targets_leak: L5
  must_return: SSN
  success: {type: regex, column: SSN, pattern: '^\d{3}-\d{2}-\d{4}$'}
